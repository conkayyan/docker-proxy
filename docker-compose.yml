# docker-proxy — 单服务 compose
# 默认从 ghcr.io 拉预构建镜像；想本地构建见 README "Build from source"。
# 用法：
#   docker compose up -d
#   浏览器打开 http://localhost:5000
#   默认账号：admin / admin123（init 时自动建）
#
# 数据持久化：./data 挂到容器内 /app/instance（SQLite + Fernet key）
#
# ⚠️ /var/run/docker.sock 挂载：worker 需要容器能调宿主 docker CLI 来跑
# `docker pull` / `docker tag` / `docker push`。挂载 socket 相当于把宿主
# docker 控制权交给容器内的 app 用户（可以起特权容器、挂载 / 等），属于等
# 价 root 的高权限授予 —— 私有部署可以接受，公网/多租户环境请改用 DOCKER_HOST
# 连远端 docker daemon，或干脆把 socket 挂载注释掉。
#
# 宿主 docker 组的 GID 常见是 999（Debian/Ubuntu 安装包默认）。Mac/Windows
# Docker Desktop 也走 socket，但 GID 可能不同；如权限报错可加：
#   group_add:
#     - "<host docker 组的 GID>"

services:
  docker-proxy:
    # 预构建镜像（CI 推送到 ghcr.io，详见 .github/workflows/docker-build.yml）
    # 改 tag 可以锁版本，比如 :v1.2.3 或 :main-<sha>
    image: ghcr.io/conkayyan/docker-proxy:latest
    container_name: docker-proxy
    # 本地构建就打开下面三行，注释掉上面的 image：
    # build: .
    # image: docker-proxy:latest
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/instance
      # 暴露宿主 docker daemon，让容器里的 docker CLI 能 pull / push 镜像。
      # 不需要直接打宿主 docker（改用 DOCKER_HOST 指向远端 daemon）就把这行注释掉。
      - /var/run/docker.sock:/var/run/docker.sock
    # 如果 docker.sock 的宿主 GID 不是 999，解除下面注释并填实际 GID：
    # group_add:
    #   - "999"
    environment:
      # 容器时区：覆盖 Dockerfile 烘焙的默认值。优先级：
      #   1. 宿主 shell / .env 里的 TZ 环境变量（最高，可设为 Europe/Paris 等）
      #   2. compose 文件里写死的默认 Asia/Shanghai
      # 镜像里已经装了 tzdata，所以任何 IANA 时区名都能用。
      TZ: ${TZ:-Asia/Shanghai}
      # 自定义 session 密钥；不设则每次启动随机（重启后旧 session 失效）
      SECRET_KEY: "change-me-in-prod"
      # 新建 Registry 时 project 字段的默认值
      HARBOR_PROJECT: "docker-proxy"
      # 监听地址 / 端口（传给 app.run；改这里的同时改上方 ports 段）
      LISTEN_HOST: "0.0.0.0"
      LISTEN_PORT: "5000"
      # 本机调试可设 "1"；生产别开（debugger 可执行任意代码）
      FLASK_DEBUG: "0"
      # 用远端 docker daemon 代替挂 socket：注释掉 socket 那行 + 取消下面注释
      # DOCKER_HOST: "tcp://docker.example.com:2375"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:${LISTEN_PORT:-5000}/login', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
{% extends "base.html" %}
{% block title %}{{ '编辑' if mode == 'edit' else '新增' }} Registry · docker-proxy{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>{{ '编辑' if mode == 'edit' else '新增' }} Registry</h1>
  <form method="post">
    {{ form.hidden_tag() }}
    <label>
      <span>名称</span>
      {{ form.name(autofocus=true) }}
    </label>
    <label>
      <span>Registry 地址</span>
      {{ form.url(placeholder="harbor.company.local") }}
      <small>{{ form.url.description }}</small>
    </label>
    <label>
      <span>用户名</span>
      {{ form.username(autocomplete="off") }}
    </label>
    <label>
      <span>密码{% if mode == 'edit' %}（留空表示不修改）{% endif %}</span>
      {{ form.password(autocomplete="new-password") }}
    </label>
    <label class="checkbox">
      {{ form.verify_tls() }}
      <span>{{ form.verify_tls.label.text }}</span>
    </label>
    <small class="hint" style="display:block; margin:-0.5rem 0 1rem 1.6rem;">
      默认勾选 = 校验 TLS 证书（生产环境推荐）。自签证书 / 内网环境请取消勾选。
    </small>
    <label>
      <span>项目路径前缀 (project)</span>
      {{ form.project(placeholder="docker-proxy") }}
      <small>{{ form.project.description }}</small>
    </label>
    <div class="row-actions">
      <button type="submit" class="btn primary">保存</button>
      <a class="btn" href="{{ url_for('registries_list') }}">取消</a>
    </div>
  </form>
</div>
{% endblock %}

{% extends "base.html" %}
{% block title %}登录 · docker-proxy{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>登录</h1>
  <form method="post">
    {{ form.hidden_tag() }}
    <label>
      <span>用户名</span>
      {{ form.username(autofocus=true, autocomplete="username") }}
    </label>
    <label>
      <span>密码</span>
      {{ form.password(autocomplete="current-password") }}
    </label>
    {{ form.submit(class_="btn primary block") }}
  </form>
</div>
{% endblock %}

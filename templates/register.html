{% extends "base.html" %}
{% block title %}注册 · docker-proxy{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>注册</h1>
  <form method="post">
    {{ form.hidden_tag() }}
    <label>
      <span>用户名（3-80 字符）</span>
      {{ form.username(autofocus=true, autocomplete="username") }}
    </label>
    <label>
      <span>密码（至少 6 位）</span>
      {{ form.password(autocomplete="new-password") }}
    </label>
    <label>
      <span>确认密码</span>
      {{ form.confirm(autocomplete="new-password") }}
    </label>
    {{ form.submit(class_="btn primary block") }}
  </form>
  <p class="hint">已有账号？<a href="{{ url_for('login') }}">直接登录</a></p>
</div>
{% endblock %}

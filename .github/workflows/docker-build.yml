name: Build and Push Docker Image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# 避免同 workflow 的旧 run 同时跑（ghcr.io 不喜欢同 tag 并发 push）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # conkayyan/docker-proxy

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write   # 让 GITHUB_TOKEN 能 push 到 ghcr.io

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # tag 推送时刷 latest（避免 latest 卡住）
            # 用 GitHub Actions 原生表达式而不是 Handlebars 的 {{is_tag}}——后者在某些
            # v5 版本里渲染为空字符串，会报 "Invalid value for enable attribute"
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            # 一条通用正则：吃掉 v 前缀，把剩下的数字段（任意段数、每段任意位数）原样保留。
            #   v1            -> 1
            #   v1.0          -> 1.0
            #   v1.11         -> 1.11
            #   v1.11.1.1.001 -> 1.11.1.1.001
            #   v1.0.0-rc.1   -> 1.0.0（正则停在前缀边界，-rc.1 被丢掉；要保留得加 ?:-...）
            type=match,pattern=v(\d+(?:\.\d+)*),group=1
            # 短 SHA 永远打一个
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # 等价于 `docker build -t docker-proxy .`
          # 但我们用 buildx 推到 registry，所以 tags 走 metadata-action 的输出
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # amd64 + arm64（python:3.11-slim 和 skopeo 都支持；本机调试可去掉 arm64 省时间）
          platforms: linux/amd64,linux/arm64
          # 利用 layer cache 加速（包依赖变化少时第二次基本秒过）
          cache-from: type=gha
          cache-to: type=gha,mode=max
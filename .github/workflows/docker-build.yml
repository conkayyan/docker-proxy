name: Build and Push Docker Image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 避免同 workflow 的旧 run 同时跑（ghcr.io 不喜欢同 tag 并发 push）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # conkayyan/docker-proxy

jobs:
  build:
    runs-on: ubuntu-latest
    # PR 只做 build，不 push（要 push 把 if 改成 always()）
    if: github.event_name != 'pull_request'

    permissions:
      contents: read
      packages: write   # 让 GITHUB_TOKEN 能 push 到 ghcr.io

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # main 分支打 latest
            type=raw,value=latest,enable={{is_default_branch}}
            # 分支名（sanitize 后）
            type=ref,event=branch
            # tag v1.2.3 -> 1.2.3, latest, v1, v1.2
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # 短 SHA 永远打一个
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # 等价于 `docker build -t docker-proxy .`
          # 但我们用 buildx 推到 registry，所以 tags 走 metadata-action 的输出
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # amd64 + arm64（python:3.11-slim 和 skopeo 都支持；本机调试可去掉 arm64 省时间）
          platforms: linux/amd64,linux/arm64
          # 利用 layer cache 加速（包依赖变化少时第二次基本秒过）
          cache-from: type=gha
          cache-to: type=gha,mode=max